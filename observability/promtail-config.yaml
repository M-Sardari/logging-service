server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: logging-service-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: logging-service
          service: logging-service
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            service: service
            context: context
            reqId: reqId
            msg: msg
      - labels:
          level:
          service:
      - timestamp:
          source: ts
          format: RFC3339Nano
      - output:
          source: msg
