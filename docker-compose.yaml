services:
  app:
    build: .
    container_name: logging_service_app
    environment:
      LOG_TO_FILE: "true"
      SERVICE_NAME: LOGGING-SERVICE
      APP_ENV: development
      PORT: 3000
    volumes:
      - app-logs:/var/log/app
    ports:
      - "3000:3000"
    networks:
      - log
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    container_name: logging_service_loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - log
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: logging_service_promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - app-logs:/var/log/app:ro
    depends_on:
      - loki
    networks:
      - log
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: logging_service_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "8000:3000"
    depends_on:
      - loki
    networks:
      - log
    restart: unless-stopped

volumes:
  app-logs:
  loki-data:
  grafana-data:

networks:
  log:
    driver: bridge
